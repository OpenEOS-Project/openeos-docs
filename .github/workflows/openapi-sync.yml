name: Sync OpenAPI spec

# Holt docs/openapi.json aus openeos-api (Branch main = Produktion) und
# öffnet einen Pull Request gegen dev, wenn sich die Datei geändert hat.
# Läuft wöchentlich und auf Knopfdruck.
on:
  schedule:
    - cron: '17 6 * * 1' # montags 06:17 UTC
  workflow_dispatch:
    inputs:
      spec_url:
        description: 'Adresse der OpenAPI-Datei (leer = openeos-api main)'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch spec
        env:
          OPENAPI_SPEC_URL: ${{ github.event.inputs.spec_url }}
        run: node scripts/openapi-sync.mjs

      - name: Open pull request
        uses: peter-evans/create-pull-request@v7
        with:
          base: dev
          branch: chore/openapi-sync
          commit-message: 'Update vendored OpenAPI spec from openeos-api'
          title: 'Update API reference from openeos-api'
          body: |
            Automated sync of `static/openapi/openeos-api.json` from
            `OpenEOS-Project/openeos-api` (`main`, `docs/openapi.json`).

            The API reference at `/api` is rendered from this file.
            Review the diff, then merge into `dev`.
          labels: documentation
          delete-branch: true
