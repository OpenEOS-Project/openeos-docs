onlyBuiltDependencies:
  - '@swc/core'
  - core-js
patchedDependencies:
  docusaurus-theme-redoc@2.5.1: patches/docusaurus-theme-redoc@2.5.1.patch
# Docusaurus 3.10 still asks for tinypool 1, and its webpack plugins
# (copy-webpack-plugin, css-minimizer-webpack-plugin) for
# serialize-javascript 6; all of it only runs while building the site.
# The newer majors keep the API Docusaurus uses. Remove once Docusaurus
# depends on them directly.
overrides:
  '@docusaurus/core>tinypool': ^2.2.0
  'serialize-javascript@<7.1.3': ^7.1.4
