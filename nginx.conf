server {
    listen       80;
    listen       [::]:80;
    server_name  docs.openeos.de;

    root   /usr/share/nginx/html;
    index  index.html;

    # Behind the TLS proxy nginx only sees http. Absolute redirects would
    # therefore point to http://… – relative Location headers keep the scheme.
    absolute_redirect off;

    # Old links still carry a trailing slash (/veranstaltungen/). Unless such
    # a directory exists (/, /en/), redirect once – relatively – to the
    # slash-less URL. Kept at server level: an `if` inside the locations
    # below would bypass their try_files.
    if (!-d $request_filename) {
        rewrite ^(/.+)/$ $1 permanent;
    }

    # gzip compression
    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css application/javascript application/json
        image/svg+xml application/xml application/manifest+json;

    # Long-lived caching for fingerprinted assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~* \.(?:js|css|woff2?|ttf|eot|png|jpg|jpeg|gif|svg|ico|webp)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # HTML should always be re-validated.
    # Docusaurus runs with trailingSlash: false and emits <route>.html, so
    # clean URLs resolve via $uri.html without a redirect. Unknown paths
    # answer with a real 404 status instead of the old soft 404 (200).
    # $uri/index.html (instead of $uri/) lets /en answer directly and keeps
    # directories without an index (e.g. /integrationen) from redirecting
    # into a 404.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/index.html $uri.html =404;
    }

    # English site: same rules, English 404 page
    location /en/ {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/index.html $uri.html =404;
        error_page 404 /en/404.html;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
    location = /en/404.html {
        internal;
    }
}
